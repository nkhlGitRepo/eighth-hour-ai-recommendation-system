<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — Eighth Hour</title>
  <link rel="stylesheet" href="../../css/style.css?v=20260815" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <header data-site-header></header>

<section class="section wrap" style="max-width: 640px;">
    <h1>My Account</h1>
    <p class="subtitle" id="accountIdentity">Loading...</p>

    <div class="account-section">
      <h2>Your Style Profile</h2>
      <div id="profileSection">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="account-section">
      <h2>Session</h2>
      <div class="account-actions">
        <button type="button" class="btn btn-outline" id="logoutButton">Log Out</button>
        <button type="button" class="btn btn-outline" id="logoutAllButton">Log Out of All Devices</button>
      </div>
    </div>

    <div class="account-section">
      <h2>Change Password</h2>
      <div class="auth-error" id="changePasswordError"></div>
      <div class="auth-banner" id="changePasswordSuccess" style="display: none;">Password changed.</div>
      <form id="changePasswordForm">
        <div class="auth-field">
          <label for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required />
        </div>
        <div class="auth-field">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" maxlength="128" required />
        </div>
        <div class="auth-field">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" name="confirmNewPassword" autocomplete="new-password" minlength="8" maxlength="128" required />
        </div>
        <button type="submit" class="btn btn-outline">Change Password</button>
      </form>
    </div>
  </section>

  <footer data-site-footer></footer>
  <script src="../../js/config.js?v=20260926"></script>
  <script src="../../js/data.js?v=20260815"></script>
  <script src="../../js/placeholder.js?v=20260815"></script>
  <script src="../../js/site-chrome.js?v=20260815"></script>
<script src="../../js/cart.js?v=20260815"></script>
  <script src="../../js/menu.js?v=20260815"></script>
  <script src="../../js/recommendations-nav-link.js?v=20260815"></script>
  <script src="../../js/style-profile-link.js?v=20260815"></script>
  <script src="../../js/auth-nav-link.js?v=20260815"></script>
  <script src="../../js/auth.js?v=20260815"></script>
  <script src="account.js"></script>
</body>
</html>
