<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Recommendations — Eighth Hour</title>
  <link rel="stylesheet" href="../../css/style.css?v=20261006" />
  <link rel="stylesheet" href="recommendations.css" />
</head>
<body>

  <header data-site-header></header>

<section class="section wrap">
    <div class="recommendations-header">
      <h1>Your Personalized Recommendations</h1>
      <p class="subtitle">Based on your shape and style preferences</p>
    </div>

    <div class="recommendations-sidebar">
      <div class="filter-section">
        <h3>Filters</h3>
        <div class="filter-group">
          <label class="filter-option">
            <input type="checkbox" name="category" value="Tops" />
            <span>Tops</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" name="category" value="Skirts" />
            <span>Skirts</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" name="category" value="Dresses" />
            <span>Dresses</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" name="category" value="Vests" />
            <span>Vests</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" name="category" value="Trousers" />
            <span>Trousers</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" name="category" value="Co-ord Sets" />
            <span>Co-ord Sets</span>
          </label>
        </div>
      </div>

      <div class="filter-section">
        <h3>Your Profile</h3>
        <div id="profileSummary" class="profile-summary">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </div>

    <div class="recommendations-main">
      <div id="recommendationsList" class="product-grid">
        <div class="loading">Loading your recommendations...</div>
      </div>
    </div>
  </section>

  <footer data-site-footer></footer>
  <script src="../../js/config.js?v=20261006"></script>
  <script src="../../js/site-chrome.js?v=20261006"></script>
<script src="../../js/data.js?v=20261006"></script>
  <script src="../../js/placeholder.js?v=20261006"></script>
  <script src="../../js/cart.js?v=20261006"></script>
  <script src="../../js/menu.js?v=20261006"></script>
  <script src="../../js/recommendations-nav-link.js?v=20261006"></script>
  <script src="../../js/style-profile-link.js?v=20261006"></script>
  <script src="../../js/auth-nav-link.js?v=20261006"></script>
  <script src="recommendations.js"></script>
</body>
</html>
