<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Eighth Hour</title>
  <link rel="stylesheet" href="../../css/style.css?v=20260815" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <header data-site-header></header>

<section class="section wrap">
    <div class="auth-container">
      <div class="auth-card">
        <h1>Log In</h1>
        <p class="subtitle">Welcome back. Log in to view or edit your style profile.</p>

        <div class="auth-banner" id="registeredBanner" style="display: none;">
          Account created — please log in.
        </div>
        <div class="auth-error" id="authError"></div>

        <form id="loginForm">
          <div class="auth-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required />
          </div>
          <div class="auth-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="auth-submit">Log In</button>
        </form>

        <p class="auth-switch">
          Don't have an account? <a href="signup.html" id="signupSwitchLink">Sign up</a>
        </p>
      </div>
    </div>
  </section>

  <footer data-site-footer></footer>
  <script src="../../js/config.js?v=20260926"></script>
  <script src="../../js/data.js?v=20260815"></script>
  <script src="../../js/placeholder.js?v=20260815"></script>
  <script src="../../js/site-chrome.js?v=20260815"></script>
<script src="../../js/cart.js?v=20260815"></script>
  <script src="../../js/menu.js?v=20260815"></script>
  <script src="../../js/recommendations-nav-link.js?v=20260815"></script>
  <script src="../../js/style-profile-link.js?v=20260815"></script>
  <script src="../../js/auth-nav-link.js?v=20260815"></script>
  <script src="../../js/auth.js?v=20260815"></script>
  <script src="login.js"></script>
</body>
</html>
