<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Eighth Hour</title>
  <link rel="stylesheet" href="../../css/style.css?v=20261006" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <header data-site-header></header>

<section class="section wrap">
    <div class="auth-container">
      <div class="auth-card">
        <h1>Sign Up</h1>
        <p class="subtitle" id="authSubtitle">Create an account to build and save your style profile.</p>

        <div class="auth-error" id="authError"></div>

        <form id="signupForm">
          <div class="auth-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required />
          </div>
          <div class="auth-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="auth-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required />
          </div>
          <div class="auth-field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required />
          </div>
          <button type="submit" class="auth-submit">Sign Up</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html" id="loginSwitchLink">Log in</a>
        </p>
      </div>
    </div>
  </section>

  <footer data-site-footer></footer>
  <script src="../../js/config.js?v=20261006"></script>
  <script src="../../js/data.js?v=20261006"></script>
  <script src="../../js/placeholder.js?v=20261006"></script>
  <script src="../../js/site-chrome.js?v=20261006"></script>
<script src="../../js/cart.js?v=20261006"></script>
  <script src="../../js/menu.js?v=20261006"></script>
  <script src="../../js/recommendations-nav-link.js?v=20261006"></script>
  <script src="../../js/style-profile-link.js?v=20261006"></script>
  <script src="../../js/auth-nav-link.js?v=20261006"></script>
  <script src="../../js/auth.js?v=20261006"></script>
  <script src="signup.js"></script>
</body>
</html>
