<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Eighth Hour</title>
  <link rel="stylesheet" href="css/style.css?v=20260815" />
</head>
<body>

  <header data-site-header></header>

<section class="section wrap form-narrow">
    <h1>Contact Us</h1>
    <p class="muted">support@example.com</p>
    <form onsubmit="handleContactSubmit(event)">
      <input type="text" placeholder="Name" required />
      <input type="email" placeholder="Email" required />
      <textarea rows="5" placeholder="Message" required></textarea>
      <button type="submit">Submit</button>
    </form>
    <p id="contactStatus" class="muted"></p>
  </section>

  <footer data-site-footer></footer>
  <script src="js/data.js?v=20260815"></script>
  <script src="js/placeholder.js?v=20260815"></script>
  <script src="js/site-chrome.js?v=20260815"></script>
<script src="js/cart.js?v=20260815"></script>
  <script src="js/menu.js?v=20260815"></script>
  <script src="js/recommendations-nav-link.js?v=20260815"></script>
  <script src="js/style-profile-link.js?v=20260815"></script>
  <script src="js/auth-nav-link.js?v=20260815"></script>
  <script>
    // Demo only — no backend, so we just confirm receipt in the UI.
    function handleContactSubmit(event) {
      event.preventDefault();
      document.getElementById("contactStatus").textContent =
        "This is a local demo — messages aren't actually sent.";
      event.target.reset();
    }
  </script>
</body>
</html>
