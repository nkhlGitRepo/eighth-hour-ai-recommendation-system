# Render blueprint for the styling-engine API (backend/).
#
# The storefront is served separately by GitHub Pages from this same branch;
# js/config.js points it at the URL this service gets.
#
# Free plan caveats:
#   - The service sleeps after 15 minutes without traffic; the next request
#     waits ~30-60 s while it wakes.
#   - The disk is temporary, so accounts and saved profiles are wiped whenever
#     the service restarts, sleeps or redeploys. To keep them, switch to a paid
#     plan and uncomment the disk below (DATABASE_PATH then points into it).
services:
  - type: web
    name: eighth-hour-api
    runtime: python
    plan: free
    branch: gh-pages
    rootDir: backend
    # 1. mediapipe pulls in opencv-contrib-python, the desktop build of OpenCV,
    #    which needs libGL -- absent on a server, so `import mediapipe` would
    #    fail on the first photo. The headless build is the same cv2 module
    #    without the GUI dependencies.
    # 2. Load the pose model once, which downloads it into the build and fails
    #    the deploy (instead of a customer's upload) if anything native is
    #    missing.
    buildCommand: >-
      pip install -r requirements.txt &&
      pip uninstall -y opencv-contrib-python &&
      pip install opencv-contrib-python-headless==5.0.0.93 &&
      python -c "from py_src.providers.mediapipe_sizing_provider import MediaPipeSizingProvider; MediaPipeSizingProvider()._get_landmarker()"
    # One worker: the pose model costs ~200 MB per worker, and the free plan
    # has 512 MB.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SIZING_PROVIDER
        value: mediapipe
      - key: ALLOWED_ORIGINS
        value: https://nkhlgitrepo.github.io
      # Where the API's own address sends a browser (it has no page of its own).
      - key: STOREFRONT_URL
        value: https://nkhlgitrepo.github.io/eighth-hour-ai-recommendation-system/
    #   - key: DATABASE_PATH
    #     value: /var/data/intake_sessions.db
